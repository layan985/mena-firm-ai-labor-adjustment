[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mena-ai-labor"
version = "0.1.1"
description = "Firm-level AI adoption and labor-market adjustment research pipeline for MENA"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.5",
  "duckdb==1.5.5",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

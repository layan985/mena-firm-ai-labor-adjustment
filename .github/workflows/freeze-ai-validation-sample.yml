name: freeze-ai-validation-sample
on:
  push:
    paths:
      - '.github/workflows/freeze-ai-validation-sample.yml'
      - 'data/pilot/research_batch_*_ai_evidence.csv'
      - 'data/interim/ai_evidence_labeled.csv'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: ai-validation-sample
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas
      - name: Build final labeled input and freeze blind packet
        run: |
          python scripts/build_ai_validation_input.py
          python scripts/draw_blinded_validation_sample.py
      - name: Commit blinded packet only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/validation/blinded_ai_validation_sample.csv
          if git diff --cached --quiet; then
            echo 'Blinded sample unchanged.'
            exit 0
          fi
          git commit -m 'Freeze blinded AI validation sample'
          git pull --rebase origin main
          git push origin HEAD:main

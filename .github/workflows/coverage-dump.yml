name: pilot-coverage-dump

on:
  push:
    paths:
      - '.github/workflows/coverage-dump.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip install -e .
      - name: Build exact pilot coverage
        run: python scripts/build_pilot_coverage.py
      - name: Print unresolved matrix
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/interim/pilot_50_coverage.csv'
          df=pd.read_csv(p)
          print('=== PER-FIRM COVERAGE ===')
          for (fid,name),g in df.groupby(['firm_id','firm_name']):
              n=int(g['employees'].notna().sum())
              unresolved=g.loc[g['employment_status'].eq('unresolved'),'year'].astype(int).tolist()
              print(f'{fid}\t{n}/8\tunresolved={unresolved}\t{name}')
          print('=== ZERO-NUMERIC FIRMS ===')
          z=df.groupby(['firm_id','firm_name'])['employees'].apply(lambda s: s.notna().sum()).reset_index(name='n')
          for r in z[z.n.eq(0)].itertuples(index=False): print(f'{r.firm_id}\t{r.firm_name}')
          PY

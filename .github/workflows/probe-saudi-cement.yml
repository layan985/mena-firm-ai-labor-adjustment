name: probe-saudi-cement

on:
  push:
    paths:
      - '.github/workflows/probe-saudi-cement.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download official Saudi Cement 2025 annual report
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          url='https://saudicement.com.sa/wp-content/themes/scc001/file-download.php?path=statement-files%2FAnnual_Report16.pdf'
          out=pathlib.Path('/tmp/saudi-cement-2025.pdf')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'})
          with urllib.request.urlopen(req,timeout=240) as r,out.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          print('FINAL_URL='+url)
          print('BYTES='+str(out.stat().st_size))
          print('SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          if not out.read_bytes()[:4] == b'%PDF':
              raise SystemExit('Official endpoint did not return a PDF')
          PY
          pdftotext -layout /tmp/saudi-cement-2025.pdf /tmp/saudi-cement-2025.txt
      - name: Extract employee evidence
        run: |
          python - <<'PY'
          import re
          lines=open('/tmp/saudi-cement-2025.txt',errors='ignore').read().splitlines()
          pats=[r'total employees',r'number of employees',r'workforce',r'headcount',r'saudization',r'saudisation',r'employees.*2025',r'employees.*2024']
          hits=[]
          for i,line in enumerate(lines):
              if any(re.search(p,line,re.I) for p in pats): hits.append(i)
          shown=[]
          for i in hits:
              if any(abs(i-j)<10 for j in shown): continue
              shown.append(i)
              print(f'--- lines {max(0,i-8)+1}-{min(len(lines),i+12)} ---')
              print('\n'.join(lines[max(0,i-8):min(len(lines),i+12)]))
          if not hits: print('NO EMPLOYEE MATCHES')
          PY

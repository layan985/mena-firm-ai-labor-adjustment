name: probe-zain-workforce

on:
  push:
    paths:
      - '.github/workflows/probe-zain-workforce.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Crawl official Zain annual report pages
        run: |
          python - <<'PY'
          import hashlib,re,urllib.parse,urllib.request
          from html import unescape
          start='https://investor.sa.zain.com/2025/'
          hdr={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*','Accept-Encoding':'identity'}
          def get(url):
              req=urllib.request.Request(url,headers=hdr)
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read()
              return data
          root=get(start)
          print('ROOT',len(root),hashlib.sha256(root).hexdigest())
          s=root.decode('utf-8','ignore')
          hrefs=re.findall(r'''href=["']([^"'#]+)''',s,re.I)
          urls=[]
          for h in hrefs:
              u=urllib.parse.urljoin(start,unescape(h))
              if u.startswith(start) and u not in urls: urls.append(u)
          print('URL_COUNT',len(urls))
          keys=re.compile(r'employee|workforce|headcount|human capital|people|saudization|saudisation|talent|nationalization',re.I)
          for u in urls:
              try: data=get(u)
              except Exception as e:
                  print('FAILED',u,type(e).__name__,e); continue
              text=unescape(re.sub(r'<[^>]+>',' ',data.decode('utf-8','ignore')))
              text=re.sub(r'\s+',' ',text)
              hits=list(keys.finditer(text))
              if hits:
                  print('\nURL',u,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest(),'HITS',len(hits))
                  shown=[]
                  for m in hits:
                      frag=text[max(0,m.start()-320):m.end()+500]
                      if frag in shown: continue
                      shown.append(frag)
                      print('CTX',frag[:1100])
                      if len(shown)>=12: break
          PY

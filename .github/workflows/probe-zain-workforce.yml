name: probe-zain-workforce

on:
  push:
    paths:
      - '.github/workflows/probe-zain-workforce.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official Zain workforce disclosure
        run: |
          python - <<'PY'
          import hashlib,re,urllib.request
          from html import unescape
          url='https://sa.zain.com/en/all-news/zain-ksa-wins-connected-world-ksa-award-its-leading-role-cultivating-next-gen-talent-and'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*','Accept-Encoding':'identity'})
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  data=r.read()
              print('FINAL_URL='+r.geturl())
              print('BYTES='+str(len(data)))
              print('SHA256='+hashlib.sha256(data).hexdigest())
              text=unescape(re.sub(r'<[^>]+>',' ',data.decode('utf-8','ignore')))
              text=re.sub(r'\s+',' ',text)
              for needle in ['1,500 employees','1500 employees','currently employing 23']:
                  i=text.lower().find(needle.lower())
                  if i>=0: print('EVIDENCE',text[max(0,i-500):i+900])
              if '1,500 employees' not in text and '1500 employees' not in text:
                  raise SystemExit('Expected headcount text not found')
          except Exception as e:
              print('FAILED',type(e).__name__,e)
              raise
          PY

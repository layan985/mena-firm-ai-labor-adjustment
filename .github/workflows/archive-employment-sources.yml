name: archive-employment-sources

on:
  push:
    paths:
      - 'data/pilot/research_batch_*_employment.csv'
      - '.github/workflows/archive-employment-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip install -e .
      - name: Archive and bind employment sources
        run: python scripts/archive_pilot_sources.py --scope employment --apply --workers 6 --timeout 90
      - name: Verify Almarai 2020 source text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python - <<'PY'
          import csv, subprocess, pathlib, sys
          url='https://sustainability.almarai.com/en/pdf/AlmaraiSustainabilityReport-2023-PDF.pdf'
          rows=list(csv.DictReader(open('data/pilot/source_archive_manifest.csv', encoding='utf-8')))
          row=next((r for r in rows if r['source_url']==url), None)
          if not row or row['status']!='archived' or not row['local_path']:
              raise SystemExit('Almarai official 2023 sustainability report was not archived')
          pdf=pathlib.Path(row['local_path'])
          txt=pathlib.Path('/tmp/almarai2023.txt')
          subprocess.run(['pdftotext','-layout',str(pdf),str(txt)],check=True)
          t=txt.read_text(errors='ignore')
          required=['37,066','36,534','323','209','35,386','38,351','41,072']
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit(f'Official PDF verification failed; missing {missing}')
          print('Official Almarai PDF contains the required 2020-2023 workforce table values.')
          print('sha256='+row['sha256'])
          PY
      - name: Rebuild coverage and validate archive
        run: |
          python scripts/build_pilot_coverage.py
          python scripts/validate_source_manifest.py
          python scripts/report_pilot_conflicts.py
      - name: Commit archived evidence and bindings
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No source archive changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/source_archive data/pilot/source_archive_manifest.csv data/pilot/research_batch_*_employment.csv data/interim/pilot_50_coverage.csv data/interim/pilot_50_coverage_summary.json
          git commit -m 'Archive employment sources and refresh pilot coverage'
          git push origin HEAD:main

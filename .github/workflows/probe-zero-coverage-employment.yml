name: probe-zero-coverage-employment
on:
  push:
    paths:
      - '.github/workflows/probe-zero-coverage-employment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install -q beautifulsoup4 requests
      - name: Discover and inspect first-party 2025 reports
        run: |
          python - <<'PY'
          import hashlib, os, re, subprocess, tempfile
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          targets = {
            'AE_DFM_AJMANBANK':'https://www.ajmanbank.ae/site/annual-integrated-reports.html',
            'AE_DFM_CBD':'https://www.cbd.ae/aboutus/investor-relations',
            'AE_DFM_EMAAR':'https://www.emaar.com/en/investor-relations/emaar-properties-pjsc/reports-presentations',
            'AE_DFM_UPP':'https://up.ae/financial-information/',
            'QA_CBQK':'https://cbq.qa/en/about-us/investor-relations',
            'QA_QGTS':'https://investors.nakilat.com/English/financial-info/annual-reports/default.aspx',
            'QA_UDCD':'https://udcqatar.com/',
            'SA_1080':'https://anb.com.sa/web/anb/annual-reports',
            'SA_3030':'https://saudicement.com.sa/category/investor-relations/annual-reports/',
            'SA_3060':'https://mfaprod.yanbucement.com/YCC/',
            'SA_5110':'https://www.se.com.sa/en/Investors/Reports-and-Presentations/Annual-Reports/',
            'SA_8010':'https://www.tawuniya.com/en/investor?tab=2',
            'SA_8210':'https://bupa.com.sa/en/IR/FinancialInformation',
          }
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/pdf,*/*','Accept-Encoding':'identity'})
          pats=re.compile(r'employee|employees|workforce|headcount|full[- ]?time|staff',re.I)
          for firm,page in targets.items():
            print('\n###',firm,page)
            try:
              r=session.get(page,timeout=45); print('INDEX',r.status_code,len(r.content),r.url)
              if r.status_code!=200: continue
              soup=BeautifulSoup(r.text,'html.parser')
              candidates=[]
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a['href'])
                text=' '.join(a.stripped_strings)
                parent=' '.join(a.parent.stripped_strings) if a.parent else text
                ctx=(text+' '+parent)[:700]
                low=(href+' '+ctx).lower()
                if ('.pdf' in href.lower() or 'download' in low or 'annual report' in low or 'integrated report' in low or 'sustainability report' in low) and ('2025' in low or '2024' in low):
                  candidates.append((href,ctx))
              dedup=[]; seen=set()
              for x in candidates:
                if x[0] not in seen:
                  seen.add(x[0]); dedup.append(x)
              print('CANDIDATES',len(dedup))
              for href,ctx in dedup[:12]: print('LINK',href,'CTX',ctx[:300])
              # Only inspect direct PDFs; dynamic/Open-Link pages remain explicit blockers.
              for idx,(href,ctx) in enumerate(dedup[:8]):
                if '.pdf' not in href.lower(): continue
                try:
                  p=session.get(href,timeout=120,allow_redirects=True)
                  print('FETCH',p.status_code,len(p.content),p.url,'SHA256',hashlib.sha256(p.content).hexdigest())
                  if p.status_code!=200 or not p.content.startswith(b'%PDF'): continue
                  fd,pdf=tempfile.mkstemp(suffix='.pdf'); os.close(fd); open(pdf,'wb').write(p.content)
                  txt=pdf+'.txt'
                  subprocess.run(['pdftotext','-layout',pdf,txt],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if os.path.exists(txt):
                    lines=open(txt,errors='ignore').read().splitlines()
                    hits=[i for i,l in enumerate(lines) if pats.search(l)]
                    print('TEXT_HITS',len(hits))
                    shown=0
                    for i in hits:
                      block='\n'.join(lines[max(0,i-3):min(len(lines),i+5)])
                      if re.search(r'\b\d{2,3}(?:,\d{3})+\b|\b\d{3,5}\b',block):
                        print('--- HIT ---\n'+block[:1800])
                        shown+=1
                        if shown>=12: break
                  for f in [pdf,txt]:
                    try: os.unlink(f)
                    except OSError: pass
                except Exception as e: print('PDF_ERROR',href,type(e).__name__,e)
            except Exception as e: print('INDEX_ERROR',type(e).__name__,e)
          PY

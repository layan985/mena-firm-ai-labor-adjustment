name: probe-tabreed-history

on:
  push:
    paths:
      - '.github/workflows/probe-tabreed-history.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: '2024'
            url: 'https://tabreed.ae/sites/default/files/2025-03/2024_Annual_Integrated_Report_En.pdf'
          - year: '2023'
            url: 'https://tabreed.ae/sites/default/files/2025-03/2023%20Integrated%20Annual%20Report_08%20MAR%202023.pdf'
          - year: '2022'
            url: 'https://tabreed.ae/sites/default/files/2025-03/2022%20Integrated%20Report_31%20DEC%202022.pdf'
          - year: '2021'
            url: 'https://tabreed.ae/sites/default/files/2025-03/2021%20Integrated%20Report_31%20DEC%202021.pdf'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download and hash official report
        env:
          REPORT_URL: ${{ matrix.url }}
          REPORT_YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url=os.environ['REPORT_URL']; year=os.environ['REPORT_YEAR']
          out=pathlib.Path(f'/tmp/tabreed-{year}.pdf')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=240) as r,out.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          print(f'YEAR={year} BYTES={out.stat().st_size} SHA256={hashlib.sha256(out.read_bytes()).hexdigest()} URL={url}')
          PY
          pdftotext -layout "/tmp/tabreed-${REPORT_YEAR}.pdf" "/tmp/tabreed-${REPORT_YEAR}.txt"
      - name: Extract workforce metrics
        env:
          REPORT_YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os,re
          year=os.environ['REPORT_YEAR']
          lines=open(f'/tmp/tabreed-{year}.txt',errors='ignore').read().splitlines()
          pats=[r'S2\.1',r'total employees',r'total workforce',r'full.?time employees',r'enterprise headcount',r'number of employees',r'headcount held by full',r'human capital']
          hits=[]
          for i,line in enumerate(lines):
              if any(re.search(p,line,re.I) for p in pats): hits.append(i)
          shown=[]
          print(f'========== TABREED {year} ==========')
          for i in hits:
              if any(abs(i-j)<10 for j in shown): continue
              shown.append(i)
              print(f'--- lines {max(0,i-7)+1}-{min(len(lines),i+11)} ---')
              print('\n'.join(lines[max(0,i-7):min(len(lines),i+11)]))
          PY

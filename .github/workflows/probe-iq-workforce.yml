name: probe-iq-workforce

on:
  push:
    paths:
      - '.github/workflows/probe-iq-workforce.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: '2020'
            url: 'https://iq.com.qa/media/31ojbphk/iq_esg_report_2020_final.pdf'
          - year: '2021'
            url: 'https://iq.com.qa/media/uexdt5va/iq-2021-sustainability-report-english.pdf'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download, hash and extract official IQ sustainability report
        env:
          YEAR: ${{ matrix.year }}
          URL: ${{ matrix.url }}
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          y=os.environ['YEAR']; url=os.environ['URL']; out=pathlib.Path(f'/tmp/iq-{y}.pdf')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Accept-Encoding':'identity'})
          try:
              with urllib.request.urlopen(req,timeout=180) as r,out.open('wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              data=out.read_bytes()
              print(f'YEAR={y} STATUS=downloaded FINAL_URL={r.geturl()} BYTES={len(data)} SHA256={hashlib.sha256(data).hexdigest()} TYPE={data[:8]!r}')
              if data[:4] != b'%PDF': raise SystemExit('not a PDF')
          except Exception as e:
              print(f'YEAR={y} STATUS=failed ERROR={type(e).__name__}: {e}')
              raise SystemExit(0)
          PY
          [ -f "/tmp/iq-${YEAR}.pdf" ] || exit 0
          pdftotext -layout "/tmp/iq-${YEAR}.pdf" "/tmp/iq-${YEAR}.txt"
          python - <<'PY'
          import os,re
          y=os.environ['YEAR']; lines=open(f'/tmp/iq-{y}.txt',errors='ignore').read().splitlines()
          pats=[r'total\s*workforce',r'total\s*employees',r'number of employees',r'workforce composition',r'QAFAC.*QAFCO.*QAPCO',r'3,?834',r'employee headcount']
          hits=[]
          for i,line in enumerate(lines):
              if any(re.search(p,line,re.I) for p in pats): hits.append(i)
          shown=[]
          print(f'========== IQ {y} WORKFORCE ==========')
          for i in hits:
              if any(abs(i-j)<10 for j in shown): continue
              shown.append(i)
              print(f'--- lines {max(0,i-8)+1}-{min(len(lines),i+12)} ---')
              print('\n'.join(lines[max(0,i-8):min(len(lines),i+12)]))
          print('HIT_COUNT='+str(len(hits)))
          PY

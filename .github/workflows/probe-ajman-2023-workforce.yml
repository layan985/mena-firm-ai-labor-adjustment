name: probe-ajman-2023-workforce
on:
  push:
    paths: ['.github/workflows/probe-ajman-2023-workforce.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/ajman.pdf 'https://www.ajmanbank.ae/site/files/Annual_Integrated_Report_2024_Ajman_Bank_compressed_Updt.pdf'
          pdftotext -layout /tmp/ajman.pdf /tmp/ajman.txt
          python - <<'PY'
          import re
          lines=open('/tmp/ajman.txt',errors='ignore').read().splitlines()
          pats=['Total of full-time','full-time employees (by gender)','full-time employees (by age)','full-time employees (by seniority)','Year-over-year change for full-time']
          for p in pats:
              print('\n###',p)
              for i,l in enumerate(lines):
                  if p.lower() in l.lower():
                      print('\n'.join(lines[max(0,i-8):min(len(lines),i+28)]))
                      print('---')
          PY

name: archive-ai-sources
on:
  push:
    paths:
      - '.github/workflows/archive-ai-sources.yml'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: source-provenance-manifest
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas
      - name: Archive pending AI evidence sources
        run: python scripts/archive_pending_sources.py --scope ai --workers 6 --timeout 180
      - name: Rebuild AI validation input
        run: python scripts/build_ai_validation_input.py
      - name: Commit manifest, bindings and validation input
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pilot/research_batch_*_ai_evidence.csv data/pilot/source_archive_manifest.csv
          git add -f data/interim/ai_evidence_labeled.csv
          if git diff --cached --quiet; then
            echo 'No AI archival changes.'
            exit 0
          fi
          git commit -m 'Bind AI evidence source provenance'
          git pull --rebase origin main
          git push origin HEAD:main

name: probe-zero-coverage-employment-v2
on:
  push:
    paths:
      - '.github/workflows/probe-zero-coverage-employment-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install -q requests beautifulsoup4
      - name: Inspect targeted first-party reports and hidden report links
        run: |
          python - <<'PY'
          import hashlib, os, re, subprocess, tempfile
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/pdf,*/*','Accept-Encoding':'identity'})
          direct={
            'AJMAN_2024':'https://www.ajmanbank.ae/site/files/Annual_Integrated_Report_2024_Ajman_Bank_compressed_Updt.pdf',
            'UDC_2025':'https://udcqatar.com/-/media/28448e61b207417e9756f8027195f1a5.ashx',
            'UDC_2024':'https://udcqatar.com/-/media/cd9bdd8807ba47ceb1a5db9dd527f2f1.ashx',
          }
          pages={
            'AJMAN':'https://www.ajmanbank.ae/site/annual-integrated-reports.html',
            'EMAAR':'https://www.emaar.com/en/investor-relations/emaar-properties-pjsc/reports-presentations',
            'SEC':'https://www.se.com.sa/en/Investors/Reports-and-Presentations/Annual-Reports/',
            'ANB':'https://anb-annualreport.com/',
          }
          def inspect(name,url):
            try:
              r=s.get(url,timeout=120,allow_redirects=True)
              print('\nDOC',name,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'CT',r.headers.get('content-type'),'SHA256',hashlib.sha256(r.content).hexdigest())
              if r.status_code!=200: return
              ispdf=r.content.startswith(b'%PDF') or 'pdf' in (r.headers.get('content-type') or '').lower()
              if not ispdf:
                text=r.text
                for m in re.finditer(r'(?i).{0,220}(?:employee|workforce|headcount|staff).{0,400}',text):
                  x=re.sub(r'<[^>]+>',' ',' '.join(m.group(0).split()))
                  if re.search(r'\d',x): print('HTML_HIT',x[:900])
                return
              fd,p=tempfile.mkstemp(suffix='.pdf'); os.close(fd); open(p,'wb').write(r.content)
              t=p+'.txt'; subprocess.run(['pdftotext','-layout',p,t],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              lines=open(t,errors='ignore').read().splitlines() if os.path.exists(t) else []
              hits=[]
              for i,l in enumerate(lines):
                if re.search(r'employee|workforce|headcount|staff',l,re.I):
                  block='\n'.join(lines[max(0,i-4):min(len(lines),i+7)])
                  if re.search(r'\b\d{1,3}(?:,\d{3})+\b|\b\d{3,5}\b',block): hits.append(block)
              print('NUMERIC_EMPLOYEE_HITS',len(hits))
              for block in hits[:25]: print('--- HIT ---\n'+block[:2200])
              for f in [p,t]:
                try: os.unlink(f)
                except OSError: pass
            except Exception as e: print('\nDOC',name,'ERROR',type(e).__name__,e)
          for n,u in direct.items(): inspect(n,u)
          for name,url in pages.items():
            try:
              r=s.get(url,timeout=60); print('\nPAGE',name,r.status_code,len(r.content),r.url)
              if r.status_code!=200: continue
              raw=r.text.replace('\\/','/')
              urls=[]
              # extract absolute/relative PDF-like links from both markup and script/JSON payloads
              for pat in [r'https?://[^"\'<> ]+?\.pdf(?:\?[^"\'<> ]*)?', r'[/][^"\'<> ]+?\.pdf(?:\?[^"\'<> ]*)?']:
                for m in re.finditer(pat,raw,re.I):
                  u=urljoin(r.url,m.group(0).replace('&amp;','&'))
                  ctx=raw[max(0,m.start()-250):m.end()+250]
                  if ('2025' in ctx or '2024' in ctx or 'annual' in ctx.lower() or 'integrated' in ctx.lower()) and u not in urls: urls.append(u)
              print('REPORT_URLS',len(urls))
              for u in urls[:12]: print('REPORT',u)
              # inspect report-looking links first
              scored=sorted(urls,key=lambda u:(0 if re.search(r'2025|2024|annual|integrated',u,re.I) else 1,len(u)))
              for j,u in enumerate(scored[:4]): inspect(name+'_'+str(j+1),u)
            except Exception as e: print('PAGE_ERROR',name,type(e).__name__,e)
          PY

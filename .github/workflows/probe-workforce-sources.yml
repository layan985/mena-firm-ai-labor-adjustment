name: probe-workforce-sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-workforce-sources.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download DFM and Tabreed official reports
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          sources={
            'dfm2025':'https://assets.dfm.ae/docs/default-source/dfm-ir/annual-report/dfm-integrated-report-2025-english.pdf?sfvrsn=9f119281_0',
            'dfm2024':'https://assets.dfm.ae/docs/default-source/dfm-ir/annual-report/dfm-integrated-report-2024.pdf?sfvrsn=3013b681_2',
            'tabreed2025':'https://tabreed.ae/sites/default/files/2026-03/2025_Annual_Integrated_Report_English.pdf',
            'tabreed2024':'https://tabreed.ae/sites/default/files/2025-03/2024_Annual_Integrated_Report_En.pdf',
            'tabreed2023':'https://tabreed.ae/sites/default/files/2025-03/2023%20Integrated%20Annual%20Report_08%20MAR%202023.pdf',
            'tabreed2022':'https://tabreed.ae/sites/default/files/2025-03/2022%20Integrated%20Report_31%20DEC%202022.pdf',
            'tabreed2021':'https://tabreed.ae/sites/default/files/2025-03/2021%20Integrated%20Report_31%20DEC%202021.pdf',
          }
          for name,url in sources.items():
              out=pathlib.Path('/tmp')/f'{name}.pdf'
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=240) as r, out.open('wb') as f:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          f.write(chunk)
                  h=hashlib.sha256(out.read_bytes()).hexdigest()
                  print(f'DOWNLOADED {name} bytes={out.stat().st_size} sha256={h} url={url}')
              except Exception as e:
                  print(f'FAILED {name}: {type(e).__name__}: {e}')
          PY
          for f in /tmp/dfm*.pdf /tmp/tabreed*.pdf; do
            [ -f "$f" ] || continue
            pdftotext -layout "$f" "${f%.pdf}.txt"
          done
      - name: Extract DFM comparable workforce evidence
        run: |
          python - <<'PY'
          import glob,re
          for fn in sorted(glob.glob('/tmp/dfm*.txt')):
              print('\n==========',fn,'==========')
              lines=open(fn,errors='ignore').read().splitlines()
              pats=[r'with\s+\d+[\d,]*\s+employees',r'full.?time employees',r'number of local',r'number of expat',r'total.*employees',r'workforce']
              hits=[]
              for i,line in enumerate(lines):
                  if any(re.search(p,line,re.I) for p in pats): hits.append(i)
              shown=[]
              for i in hits:
                  if any(abs(i-j)<12 for j in shown): continue
                  shown.append(i)
                  print(f'--- lines {max(0,i-8)+1}-{min(len(lines),i+12)} ---')
                  print('\n'.join(lines[max(0,i-8):min(len(lines),i+12)]))
          PY
      - name: Extract Tabreed comparable workforce evidence
        run: |
          python - <<'PY'
          import glob,re
          for fn in sorted(glob.glob('/tmp/tabreed*.txt')):
              print('\n==========',fn,'==========')
              lines=open(fn,errors='ignore').read().splitlines()
              pats=[r'S2\.1',r'total employees',r'total workforce',r'full.?time employees',r'enterprise headcount',r'number of employees',r'headcount held by full']
              hits=[]
              for i,line in enumerate(lines):
                  if any(re.search(p,line,re.I) for p in pats): hits.append(i)
              shown=[]
              for i in hits:
                  if any(abs(i-j)<12 for j in shown): continue
                  shown.append(i)
                  print(f'--- lines {max(0,i-8)+1}-{min(len(lines),i+12)} ---')
                  print('\n'.join(lines[max(0,i-8):min(len(lines),i+12)]))
          PY

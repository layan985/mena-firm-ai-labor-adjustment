name: probe-workforce-sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-workforce-sources.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download official source reports
        run: |
          python - <<'PY'
          import urllib.request
          sources={
            '/tmp/qib2024.pdf':'https://www.qib.com.qa/-/media/project/qib/files/sustainability-report/en/qib-sr-2024_en.pdf?rev=dd7e720596404e7c80ab6064c1d026c8',
            '/tmp/milaha2025.pdf':'https://www.milaha.com/sites/default/files/2026-02/Milaha_AR2025_ENG_Book_0.pdf',
            '/tmp/dfm2025.pdf':'https://assets.dfm.ae/docs/default-source/dfm-ir/annual-report/dfm-integrated-report-2025-english.pdf?sfvrsn=9f119281_0',
          }
          for out,url in sources.items():
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=240) as r, open(out,'wb') as f:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk: break
                      f.write(chunk)
              print(out, url)
          PY
          sha256sum /tmp/qib2024.pdf /tmp/milaha2025.pdf /tmp/dfm2025.pdf
          pdftotext -layout /tmp/qib2024.pdf /tmp/qib2024.txt
          pdftotext -layout /tmp/milaha2025.pdf /tmp/milaha2025.txt
          pdftotext -layout /tmp/dfm2025.pdf /tmp/dfm2025.txt
      - name: Print QIB workforce evidence windows
        run: |
          python - <<'PY'
          import re
          text=open('/tmp/qib2024.txt',errors='ignore').read().splitlines()
          pats=[r'total employees',r'number of employees',r'total workforce',r'workforce',r'headcount',r'full.?time',r'fte',r'qatarization']
          for i,line in enumerate(text):
              if any(re.search(p,line,re.I) for p in pats):
                  if 'workforce overview' in line.lower() or 'total workforce' in line.lower() or 'full time employees' in line.lower():
                      print('\n'.join(text[max(0,i-3):min(len(text),i+8)]))
          PY
      - name: Print Milaha 2025 employee evidence
        run: |
          python - <<'PY'
          import re
          text=open('/tmp/milaha2025.txt',errors='ignore').read().splitlines()
          patterns=[r'total number of.*employees',r'employees approxim',r'crew and divers',r'number of employees']
          hits=[]
          for i,line in enumerate(text):
              if any(re.search(p,line,re.I) for p in patterns): hits.append(i)
          for i in hits:
              print(f'--- Milaha lines {max(0,i-4)+1}-{min(len(text),i+7)} ---')
              print('\n'.join(text[max(0,i-4):min(len(text),i+7)]))
          if not hits:
              print('No matching Milaha workforce disclosure found.')
          PY
      - name: Print DFM workforce evidence windows
        run: |
          python - <<'PY'
          import re
          text=open('/tmp/dfm2025.txt',errors='ignore').read().splitlines()
          patterns=[r'total employees',r'total workforce',r'number of employees',r'employee headcount',r'headcount',r'full.?time employees',r'workforce by',r'our people']
          hits=[]
          for i,line in enumerate(text):
              if any(re.search(p,line,re.I) for p in patterns): hits.append(i)
          seen=[]
          for i in hits:
              if any(abs(i-j)<8 for j in seen): continue
              seen.append(i)
              print(f'--- DFM lines {max(0,i-7)+1}-{min(len(text),i+10)} ---')
              print('\n'.join(text[max(0,i-7):min(len(text),i+10)]))
          if not hits:
              print('No matching DFM workforce disclosure found.')
          PY

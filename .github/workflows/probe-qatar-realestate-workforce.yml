name: probe-barwa-workforce-history

on:
  push:
    paths:
      - '.github/workflows/probe-qatar-realestate-workforce.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        year: ['2018','2019','2020','2021','2022','2023','2024','2025']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download, hash and inspect official Barwa annual report
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          y=os.environ['YEAR']; url=f'https://www.barwa.com.qa/documents/en-doc-annual/{y}.pdf'
          out=pathlib.Path(f'/tmp/barwa-{y}.pdf')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Accept-Encoding':'identity'})
          try:
              with urllib.request.urlopen(req,timeout=240) as r,out.open('wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              data=out.read_bytes()
              print(f'YEAR={y} STATUS=downloaded FINAL_URL={r.geturl()} BYTES={len(data)} SHA256={hashlib.sha256(data).hexdigest()} TYPE={data[:8]!r}')
              if data[:4] != b'%PDF': raise SystemExit('not a PDF')
          except Exception as e:
              print(f'YEAR={y} STATUS=failed ERROR={type(e).__name__}: {e}')
              raise SystemExit(0)
          PY
          [ -f "/tmp/barwa-${YEAR}.pdf" ] || exit 0
          pdftotext -layout "/tmp/barwa-${YEAR}.pdf" "/tmp/barwa-${YEAR}.txt"
          python - <<'PY'
          import os,re
          y=os.environ['YEAR']; lines=open(f'/tmp/barwa-{y}.txt',errors='ignore').read().splitlines()
          pats=[r'\bEmployees\b',r'total workforce',r'total employees',r'number of employees',r'employee headcount',r'head.?count',r'male.?female ratio',r'Qatarization',r'Qatarisation',r'Human Capital',r'Investing in Our Human Capital']
          hits=[]
          for i,line in enumerate(lines):
              if any(re.search(p,line,re.I) for p in pats): hits.append(i)
          shown=[]
          print(f'========== BARWA {y} WORKFORCE ==========')
          for i in hits:
              if any(abs(i-j)<18 for j in shown): continue
              shown.append(i)
              print(f'--- lines {max(0,i-18)+1}-{min(len(lines),i+30)} ---')
              print('\n'.join(lines[max(0,i-18):min(len(lines),i+30)]))
          print('HIT_COUNT='+str(len(hits)))
          PY
